    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* Интерактивные кликабельные заголовки аккордеона */
        .accordion-header {
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
        }

        .accordion-header::after {
            content: "✦";
            font-size: 14px;
            color: #38bdf8;
            transition: transform 0.3s ease;
        }

        .accordion-block.active .accordion-header::after {
            transform: rotate(90deg);
        }

        /* По умолчанию контент скрыт */
        .accordion-content {
            display: none;
            margin-top: 15px;
            padding-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* При активации покажем контент */
        .accordion-block.active .accordion-content {
            display: block;
        }

        /* Увеличение логотипа в 2 раза */
        .logo-icon {
            font-size: 2em;
        }
    </style>
</head>
