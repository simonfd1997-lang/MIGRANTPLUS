<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MigrantPlus — Главная</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Шапка сайта -->
    <header>
        <div class="container">
            <h1 class="logo">MigrantPlus</h1>
            <nav>
                <a href="#about">О проекте</a>
                <a href="#services">Услуги</a>
                <a href="#contact">Контакты</a>
            </nav>
        </div>
    </header>

    <!-- Главный блок (Hero) -->
    <section class="hero">
        <div class="container">
            <h2>Полезные решения и сервисы</h2>
            <p>Современный независимый проект без навязчивой рекламы и платных подписок.</p>
            <a href="#contact" class="btn">Связаться</a>
        </div>
    </section>

    <!-- Блок «О проекте» -->
    <section id="about" class="section">
        <div class="container">
            <h3>О нас</h3>
            <p>Здесь вы можете разместить описание вашего проекта, портфолио, полезные статьи или инструменты.</p>
        </div>
    </section>

    <!-- Подвал -->
    <footer>
        <div class="container">
            <p>&copy; 2026 MigrantPlus. Все права защищены.</p>
        </div>
    </footer>

</body>
</html>
