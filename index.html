<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MigrantPlus</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90' fill='%2338bdf8'>✦</text></svg>">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- Библиотека иконок Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* Интерактивные кликабельные заголовки аккордеона */
        .accordion-header {
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
        }

        .accordion-header::after {
            content: "✦";
            font-size: 14px;
            color: #38bdf8;
            transition: transform 0.3s ease;
        }

        .accordion-block.active .accordion-header::after {
            transform: rotate(90deg);
        }

        /* По умолчанию контент скрыт */
        .accordion-content {
            display: none;
            margin-top: 15px;
            padding-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* При активации покажем контент */
        .accordion-block.active .accordion-content {
            display: block;
        }

        /* Увеличение логотипа в 2 раза */
        .logo-icon {
            font-size: 2em;
        }
    </style>
</head>

                <a href="#about" class="nav-btn" data-en="About" data-es="Acerca de" data-pt="Sobre" data-it="Chi siamo" data-fr="À propos" data-bn="সম্পর্কে" data-hi="परिचय" data-hy="Մեր մասին">About</a>

            </nav>
